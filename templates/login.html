<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="SM Construction Admin Login Panel">

    <title>Admin Login | SM Construction</title>

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- OPTIONAL MAIN CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            padding:20px;

            background:
            linear-gradient(
            135deg,
            #071223,
            #0b1b2b
            );
        }

        /* LOGIN BOX */
        .login-box{

            width:100%;
            max-width:380px;

            background:#101c33;

            padding:40px;

            border-radius:20px;

            box-shadow:
            0 0 35px rgba(0,0,0,0.5);

            animation:fadeIn 0.8s ease;
        }

        /* ICON */
        .icon{

            text-align:center;

            font-size:55px;

            color:#ffbf24;

            margin-bottom:15px;
        }

        /* TITLE */
        h1{

            text-align:center;

            color:#ffbf24;

            margin-bottom:25px;

            font-size:30px;
        }

        /* ERROR */
        .error{

            color:#ff5c5c;

            text-align:center;

            margin-bottom:15px;

            font-weight:bold;
        }

        /* FORM */
        form{
            display:flex;
            flex-direction:column;
        }

        /* INPUTS */
        input{

            width:100%;

            padding:14px;

            margin-bottom:18px;

            border:none;

            border-radius:10px;

            outline:none;

            background:#0b1324;

            color:white;

            font-size:15px;

            transition:0.3s ease;
        }

        input:focus{

            box-shadow:
            0 0 12px rgba(255,191,36,0.5);

            transform:scale(1.02);
        }

        /* BUTTON */
        button{

            width:100%;

            padding:14px;

            border:none;

            border-radius:10px;

            background:#ffbf24;

            color:black;

            font-size:18px;

            font-weight:bold;

            cursor:pointer;

            transition:0.3s ease;
        }

        button:hover{

            background:white;

            transform:translateY(-2px);
        }

        /* ANIMATION */
        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(-20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        /* MOBILE */
        @media(max-width:480px){

            .login-box{
                padding:30px 20px;
            }

            h1{
                font-size:25px;
            }

            .icon{
                font-size:45px;
            }
        }

    </style>

</head>

<body>

    <div class="login-box">

        <div class="icon">

            <i class="fa fa-lock"></i>

        </div>

        <h1>

            Admin Login

        </h1>

        {% if error %}

        <p class="error">

            {{ error }}

        </p>

        {% endif %}

        <form method="POST">

            <input type="text"
                   name="username"
                   placeholder="Username"
                   autocomplete="username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   autocomplete="current-password"
                   required>

            <button type="submit">

                Login

            </button>

        </form>

    </div>

</body>

</html>
