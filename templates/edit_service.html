<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Service</title>

    <style>
        body{
            background:#071223;
            color:white;
            font-family:Arial;
            padding:30px;
        }

        form{
            max-width:500px;
            margin:auto;
            background:#101c33;
            padding:20px;
            border-radius:15px;
        }

        input, textarea{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:none;
            border-radius:8px;
            background:#0b1324;
            color:white;
        }

        button{
            width:100%;
            padding:12px;
            background:#ffbf24;
            border:none;
            border-radius:8px;
            font-weight:bold;
            cursor:pointer;
        }

        h2{
            text-align:center;
            color:#ffbf24;
            margin-bottom:20px;
        }

        img{
            width:100%;
            border-radius:10px;
            margin-bottom:10px;
        }
    </style>

</head>

<body>

<h2>Edit Service</h2>

<form method="POST" enctype="multipart/form-data">

    <label>Service Name</label>
    <input type="text" name="name" value="{{ service.name }}" required>

    <label>Description</label>
    <textarea name="description" required>{{ service.description }}</textarea>

    {% if service.image %}
        <img src="{{ service.image }}">
    {% endif %}

    <label>Change Image</label>
    <input type="file" name="image">

    <button type="submit">Update Service</button>

</form>

</body>
</html>
