<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <!-- MAIN CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- CHANGE PASSWORD CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/change-password.css') }}">

</head>

<body>

<div class="change-password-container">

    <div class="change-password-box">

        <h2>Change Password</h2>

        {% if message %}
            <p class="message">
                {{ message }}
            </p>
        {% endif %}

        <form method="POST">

            <input type="password"
                   name="current_password"
                   placeholder="Current Password"
                   required>

            <input type="password"
                   name="new_password"
                   placeholder="New Password"
                   required>

            <input type="password"
                   name="confirm_password"
                   placeholder="Confirm New Password"
                   required>

            <button type="submit">
                Update Password
            </button>

        </form>

        <a href="/admin" class="back-btn">
            ← Back to Admin Panel
        </a>

    </div>

</div>

</body>
</html>
