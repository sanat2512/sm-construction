<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {{ service.name }}
    </title>

    <link rel="stylesheet" href="{{ url_for('static',
    filename='css/style.css') }}">

    <style>
        body {
            background: #071223;
            color: white;
            font-family: Arial;
            margin: 0;
            padding: 0;
        }

        /* HERO SECTION */

        .service-hero {

            height: 60vh;

            background-image: linear-gradient(rgba(0, 0, 0, 0.6),
                rgba(0, 0, 0, 0.6)),

            url('{% if service.image %}
                    {{ service.image if "http" in service.image else url_for("static", filename="uploads/" + service.image) }}
                 {% else %}
                    {{ url_for("static", filename="img/default.jpg") }}
                 {% endif %}');

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            padding: 20px;
        }

        .service-hero-content h1 {

            font-size: 60px;
            color: #ffbf24;
            margin-bottom: 20px;
        }

        .service-hero-content p {

            max-width: 800px;
            line-height: 1.8;
            font-size: 18px;
            color: white;
        }

        .back-btn {

            display: inline-block;

            margin-top: 30px;

            background: #ffbf24;

            color: black;

            padding: 14px 30px;

            text-decoration: none;

            border-radius: 10px;

            font-weight: bold;

            transition: 0.4s;
        }

        .back-btn:hover {

            background: white;
        }

        /* DESCRIPTION SECTION */

        .service-description {

            padding: 80px 8%;
        }

        .description-box {

            max-width: 1000px;

            margin: auto;

            background: #101c33;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 0 20px rgba(255, 191, 36, 0.1);
        }

        .description-box h2 {

            color: #ffbf24;

            margin-bottom: 20px;

            font-size: 38px;
        }

        .description-box p {

            color: #dddddd;

            line-height: 2;

            font-size: 18px;
        }

        /* PROJECT SECTION */

        .projects-section {

            padding: 80px 8%;
        }

        .section-title {

            text-align: center;
            font-size: 42px;
            color: #ffbf24;
            margin-bottom: 50px;
        }

        .grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(320px, 1fr));

            gap: 30px;
        }

        .project-card {

            background: #101c33;

            border-radius: 20px;

            overflow: hidden;

            transition: 0.5s;
        }

        .project-card:hover {

            transform: translateY(-10px);

            box-shadow:
                0 0 25px rgba(255, 191, 36, 0.3);
        }

        .project-card img {

            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .project-content {

            padding: 25px;
        }

        .project-content h3 {

            color: #ffbf24;
            margin-bottom: 15px;
        }

        .project-content p {

            color: #dddddd;
            line-height: 1.7;
        }

        @media(max-width:768px) {

            .service-hero-content h1 {
                font-size: 40px;
            }

            .service-hero {
                height: auto;
                padding: 100px 20px;
            }

            .description-box {
                padding: 25px;
            }

            .description-box h2 {
                font-size: 30px;
            }

            .section-title {
                font-size: 34px;
            }
        }
    </style>

</head>

<body>

    <!-- HERO SECTION -->

    <section class="service-hero">

        <div class="service-hero-content">

            <h1>
                {{ service.name }}
            </h1>

            <p>
                Premium Quality Construction Services
            </p>

            <a href="/" class="back-btn">

                Back To Home

            </a>

        </div>

    </section>

    <!-- DESCRIPTION SECTION -->

    <section class="service-description">

        <div class="description-box">

            <h2>
                About {{ service.name }}
            </h2>

            <p>
                {{ service.description }}
            </p>

        </div>

    </section>

    <!-- PROJECTS SECTION -->

    <section class="projects-section">

        <h2 class="section-title">

            Related Projects

        </h2>

        <div class="grid">

            {% for project in projects %}

            <a href="/project/{{ project.id }}" style="text-decoration:none;color:white;">

                <div class="project-card">

                    {% if project.image %}
                        <img src="{{ project.image if 'http' in project.image else url_for('static', filename='uploads/' + project.image) }}"
                             alt="{{ project.title }}">
                    {% else %}
                        <img src="{{ url_for('static', filename='img/default.jpg') }}"
                             alt="{{ project.title }}">
                    {% endif %}

                    <div class="project-content">

                        <h3>
                            {{ project.title }}
                        </h3>

                        <p>
                            {{ project.description }}
                        </p>

                    </div>

                </div>

            </a>

            {% endfor %}

        </div>

    </section>

</body>

</html>
